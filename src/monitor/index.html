<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open SWE - Thread Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --font-mono: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .refresh-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background-color: var(--bg-tertiary);
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-switch.active {
            background-color: var(--accent-blue);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .refresh-btn {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .last-updated {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--border-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .card-value.busy { color: var(--accent-blue); }
        .card-value.idle { color: var(--accent-green); }
        .card-value.error { color: var(--accent-red); }
        .card-value.interrupted { color: var(--accent-yellow); }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .filter-select, .filter-input {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .filter-input {
            min-width: 200px;
        }

        /* Thread Table */
        .table-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .thread-table {
            width: 100%;
            border-collapse: collapse;
        }

        .thread-table th {
            background-color: var(--bg-tertiary);
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
        }

        .thread-table th:hover {
            color: var(--text-primary);
        }

        .thread-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        .thread-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .thread-table tr:last-child td {
            border-bottom: none;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-badge.idle {
            background-color: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }
        .status-badge.idle::before { background-color: var(--accent-green); }

        .status-badge.busy {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
        }
        .status-badge.busy::before { background-color: var(--accent-blue); }

        .status-badge.interrupted {
            background-color: rgba(210, 153, 34, 0.15);
            color: var(--accent-yellow);
        }
        .status-badge.interrupted::before { background-color: var(--accent-yellow); }

        .status-badge.error {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }
        .status-badge.error::before { background-color: var(--accent-red); }

        /* Thread ID */
        .thread-id {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--accent-blue);
            cursor: pointer;
        }

        .thread-id:hover {
            text-decoration: underline;
        }

        /* Source */
        .source-cell {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .source-icon {
            width: 16px;
            height: 16px;
        }

        .source-link {
            color: var(--text-primary);
            text-decoration: none;
        }

        .source-link:hover {
            color: var(--accent-blue);
        }

        /* Created At */
        .created-at-cell {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Metadata */
        .metadata-cell {
            max-width: 300px;
        }

        .metadata-item {
            display: flex;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .metadata-label {
            color: var(--text-secondary);
        }

        .metadata-value {
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        /* Actions */
        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.375rem 0.625rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .action-btn:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .action-btn.primary {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .action-btn.primary:hover {
            background-color: #4194f0;
        }

        /* Detail Panel */
        .detail-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 500px;
            height: 100vh;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 200;
            overflow-y: auto;
        }

        .detail-panel.active {
            display: block;
        }

        .detail-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .detail-close:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .detail-content {
            padding: 1.5rem;
        }

        .detail-section {
            margin-bottom: 2rem;
        }

        .detail-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .detail-value {
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: var(--font-mono);
            text-align: right;
            word-break: break-all;
        }

        .detail-value a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }

        /* Event Timeline */
        .timeline {
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.25rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--border-color);
        }

        .timeline-item {
            position: relative;
            padding-bottom: 1.5rem;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -1.375rem;
            top: 0.25rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-blue);
            border: 2px solid var(--bg-secondary);
        }

        .timeline-dot.success { background-color: var(--accent-green); }
        .timeline-dot.error { background-color: var(--accent-red); }
        .timeline-dot.warning { background-color: var(--accent-yellow); }

        .timeline-content {
            font-size: 0.875rem;
        }

        .timeline-title {
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .timeline-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(13, 17, 23, 0.8);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .container {
                padding: 1rem;
            }

            .detail-panel {
                width: 100%;
            }

            .thread-table {
                font-size: 0.75rem;
            }

            .thread-table th,
            .thread-table td {
                padding: 0.5rem;
            }

            .metadata-cell {
                max-width: 150px;
            }
        }

        /* Utility */
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                Open SWE Monitor
            </div>
        </div>
        <div class="header-right">
            <div class="refresh-toggle">
                <span>Auto-refresh</span>
                <div class="toggle-switch active" id="autoRefreshToggle"></div>
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
                Refresh
            </button>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
    </header>

    <main class="container">
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    Active Threads
                </div>
                <div class="card-value busy" id="activeCount">0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Idle Threads
                </div>
                <div class="card-value idle" id="idleCount">0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    Errors
                </div>
                <div class="card-value error" id="errorCount">0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                    Total Threads
                </div>
                <div class="card-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label class="filter-label">Status:</label>
                <select class="filter-select" id="statusFilter">
                    <option value="">All</option>
                    <option value="idle">Idle</option>
                    <option value="busy">Busy</option>
                    <option value="interrupted">Interrupted</option>
                    <option value="error">Error</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Source:</label>
                <select class="filter-select" id="sourceFilter">
                    <option value="">All</option>
                    <option value="github">GitHub</option>
                    <option value="jira">Jira</option>
                    <option value="telegram">Telegram</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Search:</label>
                <input type="text" class="filter-input" id="searchInput" placeholder="Thread ID, repo, branch...">
            </div>
        </div>

        <!-- Thread Table -->
        <div class="table-container">
            <table class="thread-table">
                <thead>
                    <tr>
                        <th data-sort="threadId">Thread ID</th>
                        <th data-sort="source">Source</th>
                        <th data-sort="status">Status</th>
                        <th data-sort="createdAt">Created At</th>
                        <th>Sandbox / Branch</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="threadTableBody">
                    <!-- Threads populated by JS -->
                </tbody>
            </table>
            <div class="empty-state hidden" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h3>No threads found</h3>
                <p>Threads will appear here when webhook events are processed.</p>
            </div>
        </div>
    </main>

    <!-- Detail Panel -->
    <aside class="detail-panel" id="detailPanel">
        <div class="detail-header">
            <h2 class="detail-title">Thread Details</h2>
            <button class="detail-close" id="closeDetail">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="detail-content" id="detailContent">
            <!-- Details populated by JS -->
        </div>
    </aside>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="/monitor/app.js"></script>
</body>
</html>
